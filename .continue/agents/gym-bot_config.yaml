%YAML 1.1
---
name: Local FLM Config
version: 1.0.0
schema: v1

########################################################
# YAML ANCHORS - Para evitar duplicación
########################################################
defaults: &defaults
  provider: openai
  apiBase: http://127.0.0.1:52625/v1
  apiKey: flm
  requestOptions:
    timeout: 720000
  defaultCompletionOptions:
    contextLength: 32768
    maxTokens: 4096
    temperature: 0.1
    topP: 0.9
  autocompleteOptions:
    disable: true

########################################################
# MODELS
########################################################
models:
  ########################################################
  # MAIN AGENT MODELS (NPU via FLM)
  ########################################################
  # 1: General purpose coding assistant
  - name: Qwen3 8B Agent
    <<: *defaults
    model: qwen3:8b
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

  # 2: Modelo para razonamiento complejo (usar selectivamente)
  - name: GPT-OSS 20B
    <<: *defaults
    model: gpt-oss:20b
    capabilities:
      - tool_use
    roles:
      - chat
    defaultCompletionOptions:
      <<: *defaults
      temperature: 0.2
      # ⚠ Verifica si este modelo soporta 'reasoning: true'
      # reasoning: true  # Solo para Claude 3.7+ y algunos modelos Ollama

  ########################################################
  # AUTOCOMPLETE MODEL
  ########################################################
  # - name: Qwen3.5 2B Autocomplete
  #   <<: *defaults
  #   model: qwen3.5:2b
  #   roles:
  #     - autocomplete
  #   autocompleteOptions:
  #     disable: false
  #     debounceDelay: 200
  #     maxPromptTokens: 768
  #     onlyMyCode: true
  #     useCache: true
  #     useImports: true
  #     useRecentlyEdited: true
  #     useRecentlyOpened: true
  #   defaultCompletionOptions:
  #     temperature: 0.1
  #     maxTokens: 128
  #   requestOptions:
  #     timeout: 10000

  ########################################################
  # EMBEDDINGS
  ########################################################
  - name: BGE-M3
    provider: ollama
    model: bge-m3:latest
    apiBase: http://127.0.0.1:11434
    roles:
      - embed
    embedOptions:
      maxChunkSize: 512
      maxBatchSize: 16
    defaultCompletionOptions:
      keepAlive: 1800

  ########################################################
  # RERANKER
  ########################################################
  # - name: BGE Reranker
  #   provider: ollama
  #   model: bbjson/bge-reranker-base:latest
  #   apiBase: http://127.0.0.1:11434
  #   roles:
  #     - rerank
  #   defaultCompletionOptions:
  #     keepAlive: 1800

  ########################################################
  # CONTEXT PROVIDERS
  ########################################################
context:
  - provider: codebase
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: open
  - provider: currentFile
  - provider: tree
  - provider: problems
  - provider: os
  - provider: repo-map

params:
  includeSignatures: true

########################################################
# RULES - Consolidadas (aplican a todos los modos)
########################################################
rules:
  # Principios de ingeniería
  - "You are an expert senior software engineer and autonomous coding agent."
  - "Always analyze repository context before answering or making changes."
  - "Reuse existing project patterns, architecture, and conventions."
  - "Prefer minimal, targeted modifications over full rewrites."

  # Prevención de alucinaciones
  - "Never invent APIs, files, libraries, or functionality that doesn't exist."