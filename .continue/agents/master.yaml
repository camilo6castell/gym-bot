%YAML 1.1
---
name: Local AI Stack
version: 1.0.0
schema: v1

########################################################
# DEFAULTS
########################################################

defaults: &defaults
  provider: openai
  apiBase: http://127.0.0.1:52625/v1
  apiKey: flm

  requestOptions:
    timeout: 720000

  defaultCompletionOptions:
    contextLength: 32768
    maxTokens: 4096
    temperature: 0.0
    topP: 0.95

########################################################
# MODELS
########################################################

models:

########################################################
# PRIMARY CODING MODEL
########################################################

  - name: Qwen3.5 9B Agent
    <<: *defaults

    model: qwen3.5:9b

    roles:
      - chat
      - edit
      - apply

    capabilities:
      - tool_use

########################################################
# SECONDARY CODING MODEL
########################################################

  - name: Qwen3.5 2B Agent
    <<: *defaults

    model: qwen3.5:2b

    roles:
      - chat
      - edit
      - apply

    capabilities:
      - tool_use

########################################################
# HEAVY REASONING MODEL
########################################################

  - name: GPT-OSS 20B
    <<: *defaults

    model: gpt-oss:20b

    roles:
      - chat

    capabilities:
      - tool_use

    defaultCompletionOptions:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.1
      topP: 0.95

