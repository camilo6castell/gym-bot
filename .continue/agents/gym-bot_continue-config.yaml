  ########################################################
  # EMBEDDINGS
  ########################################################

  # 1: Fast and efficient embedding model for code search and retrieval tasks.

  - name: Nomic Embeddings
    provider: ollama
    model: nomic-embed-text
    apiBase: http://127.0.0.1:11434

    roles:
      - embed

    embedOptions:
      maxChunkSize: 384
      maxBatchSize: 16

    defaultCompletionOptions:
      keepAlive: 1800

  ########################################################
  # RERANKER - No hay modelos bnuenos disponibles.
  ########################################################

  # - name: BGE Reranker
  #   provider: ollama
  #   model: bbjson/bge-reranker-base:latest
  #   apiBase: http://127.0.0.1:11434

  #   roles:
  #     - rerank

  #   defaultCompletionOptions:
