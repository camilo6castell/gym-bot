########################################################
# CONTEXT PROVIDERS
########################################################

context:
  - provider: codebase
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: open
  - provider: currentFile
  - provider: tree
  - provider: problems
  - provider: os
  - provider: repo-map
    params:
      includeSignatures: true

########################################################
# DOCS
########################################################

# docs:
#   - name: Continue
#     startUrl: https://docs.continue.dev/intro
#     favicon: https://docs.continue.dev/favicon.ico

########################################################
# RULES
########################################################

rules:
  - "Reuse existing project patterns whenever possible."
  - "Prefer minimal modifications over rewrites."
  - "Do not invent APIs, files, or architecture."
  - "If insufficient codebase context exists, explicitly state it."
